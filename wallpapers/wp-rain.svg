<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080">
<!-- AMBER LINUX · resin-rain — rain made literal and on-brand: falling drops of
     resin, each one already an inclusion holding a single glyph of source code.
     Three depth tiers; ripples where the drops land.
     Palette: amberlinux.org tokens.css only. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#080600"/>
    <stop offset="70%" stop-color="#100d00"/>
    <stop offset="100%" stop-color="#1a1600"/>
  </linearGradient>

  <!-- drop body: lit from the sheet-lightning glow top-right -->
  <radialGradient id="dropfill" cx="42%" cy="62%" r="70%">
    <stop offset="0%"  stop-color="#f0c840"/>
    <stop offset="45%" stop-color="#f5a623"/>
    <stop offset="82%" stop-color="#c07800"/>
    <stop offset="100%" stop-color="#7d4400"/>
  </radialGradient>

  <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#f5a623" stop-opacity="0"/>
    <stop offset="100%" stop-color="#f5a623" stop-opacity="0.4"/>
  </linearGradient>

  <radialGradient id="shaft" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f0c840" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#f0c840" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="vig" cx="50%" cy="45%" r="78%">
    <stop offset="55%" stop-color="#080600" stop-opacity="0"/>
    <stop offset="100%" stop-color="#080600" stop-opacity="0.8"/>
  </radialGradient>

  <filter id="haze"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="dof"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- one falling resin drop: motion streak + teardrop + specular -->
  <g id="drop">
    <line x1="0" y1="-150" x2="0" y2="-36" stroke="url(#streak)" stroke-width="3"/>
    <path d="M0 -30 C 11 -10, 18 1, 18 12 A 18 18 0 1 1 -18 12 C -18 1, -11 -10, 0 -30 Z"
          fill="url(#dropfill)" stroke="#f0c840" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="-6.5" cy="8" r="3" fill="#fff" opacity="0.55"/>
  </g>

  <style>
    .gl { font-family: 'Courier New', Courier, monospace; font-weight: bold;
          font-size: 20px; fill: #2d1800; text-anchor: middle; }
    .near { opacity: 0.98; }
    .mid  { opacity: 0.72; }
    .far  { opacity: 0.42; }
  </style>
</defs>

<!-- ============ night air ============ -->
<rect width="1920" height="1080" fill="url(#bg)"/>

<!-- diffuse storm-light high on the right, like sheet lightning behind cloud -->
<ellipse cx="1500" cy="120" rx="900" ry="420" fill="url(#shaft)" filter="url(#haze)"/>
<ellipse cx="380" cy="1040" rx="700" ry="180" fill="#c07800" opacity="0.10" filter="url(#haze)"/>

<!-- faint mist of drops too far to resolve -->
<g stroke="#907326" stroke-width="1.4" opacity="0.35" filter="url(#dof)">
  <line x1="240" y1="90"  x2="240" y2="150"/>
  <line x1="530" y1="180" x2="530" y2="232"/>
  <line x1="705" y1="60"  x2="705" y2="108"/>
  <line x1="1010" y1="130" x2="1010" y2="178"/>
  <line x1="1180" y1="40" x2="1180" y2="92"/>
  <line x1="1385" y1="210" x2="1385" y2="258"/>
  <line x1="1620" y1="90" x2="1620" y2="140"/>
  <line x1="1815" y1="260" x2="1815" y2="308"/>
  <line x1="90"  y1="330" x2="90"  y2="378"/>
  <line x1="420" y1="420" x2="420" y2="465"/>
  <line x1="880" y1="330" x2="880" y2="372"/>
  <line x1="1500" y1="420" x2="1500" y2="462"/>
  <line x1="1730" y1="560" x2="1730" y2="600"/>
  <line x1="150" y1="620" x2="150" y2="662"/>
  <line x1="640" y1="700" x2="640" y2="738"/>
  <line x1="1290" y1="640" x2="1290" y2="678"/>
</g>

<!-- ============ far tier: small, dim, out of focus ============ -->
<g class="far" filter="url(#dof)">
  <g transform="translate(330 240) scale(0.55)"><use xlink:href="#drop"/><text class="gl" y="19">:</text></g>
  <g transform="translate(760 160) scale(0.5)"><use xlink:href="#drop"/><text class="gl" y="19">l</text></g>
  <g transform="translate(1120 300) scale(0.55)"><use xlink:href="#drop"/><text class="gl" y="19">s</text></g>
  <g transform="translate(1560 200) scale(0.5)"><use xlink:href="#drop"/><text class="gl" y="19">0</text></g>
  <g transform="translate(1870 420) scale(0.55)"><use xlink:href="#drop"/><text class="gl" y="19">;</text></g>
  <g transform="translate(210 520) scale(0.5)"><use xlink:href="#drop"/><text class="gl" y="19">~</text></g>
  <g transform="translate(950 480) scale(0.5)"><use xlink:href="#drop"/><text class="gl" y="19">.</text></g>
  <g transform="translate(1660 660) scale(0.55)"><use xlink:href="#drop"/><text class="gl" y="19">x</text></g>
  <g transform="translate(500 640) scale(0.5)"><use xlink:href="#drop"/><text class="gl" y="19">1</text></g>
</g>

<!-- ============ middle tier ============ -->
<g class="mid">
  <g transform="translate(120 200)"><use xlink:href="#drop"/><text class="gl" y="19">$</text></g>
  <g transform="translate(620 330) scale(0.85)"><use xlink:href="#drop"/><text class="gl" y="19">p</text></g>
  <g transform="translate(1310 170) scale(0.9)"><use xlink:href="#drop"/><text class="gl" y="19">a</text></g>
  <g transform="translate(1740 340) scale(0.85)"><use xlink:href="#drop"/><text class="gl" y="19">m</text></g>
  <g transform="translate(320 760) scale(0.9)"><use xlink:href="#drop"/><text class="gl" y="19">b</text></g>
  <g transform="translate(1470 540) scale(0.85)"><use xlink:href="#drop"/><text class="gl" y="19">e</text></g>
  <g transform="translate(860 690) scale(0.8)"><use xlink:href="#drop"/><text class="gl" y="19">r</text></g>
  <g transform="translate(1180 820) scale(0.9)"><use xlink:href="#drop"/><text class="gl" y="19">&gt;</text></g>
  <g transform="translate(60 900) scale(0.8)"><use xlink:href="#drop"/><text class="gl" y="19">|</text></g>
</g>

<!-- ============ near tier: large, bright, glowing ============ -->
<g class="near" filter="url(#glow)">
  <g transform="translate(430 430) scale(1.5)"><use xlink:href="#drop"/><text class="gl" y="19">{</text></g>
  <g transform="translate(1620 850) scale(1.7)"><use xlink:href="#drop"/><text class="gl" y="19">}</text></g>
  <g transform="translate(1840 620) scale(1.3)"><use xlink:href="#drop"/><text class="gl" y="19">*</text></g>
  <g transform="translate(90 560) scale(1.4)"><use xlink:href="#drop"/><text class="gl" y="19">#</text></g>
  <g transform="translate(700 880) scale(1.35)"><use xlink:href="#drop"/><text class="gl" y="19">λ</text></g>
  <g transform="translate(1270 420) scale(1.25)"><use xlink:href="#drop"/><text class="gl" y="19">@</text></g>
</g>

<!-- ============ where they land: pools and ripples ============ -->
<g fill="none">
  <!-- ripple set A -->
  <g stroke="#c07800">
    <ellipse cx="430" cy="1012" rx="120" ry="16" stroke-width="2.5" opacity="0.35"/>
    <ellipse cx="430" cy="1012" rx="74"  ry="10" stroke-width="2" opacity="0.45"/>
    <ellipse cx="430" cy="1012" rx="34"  ry="5"  stroke-width="1.5" opacity="0.55" stroke="#f5a623"/>
  </g>
  <!-- ripple set B, mid-splash with a crown -->
  <g stroke="#f5a623">
    <ellipse cx="1180" cy="1030" rx="90" ry="12" stroke-width="2" opacity="0.4"/>
    <ellipse cx="1180" cy="1030" rx="44" ry="6.5" stroke-width="1.5" opacity="0.55"/>
  </g>
  <g stroke="#f0c840" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 1168 1026 C 1164 1016, 1158 1010, 1152 1006"/>
    <path d="M 1180 1024 C 1180 1014, 1180 1008, 1180 1002"/>
    <path d="M 1192 1026 C 1196 1016, 1202 1010, 1208 1006"/>
  </g>
  <!-- ripple set C, small and distant -->
  <g stroke="#907326">
    <ellipse cx="1690" cy="1000" rx="60" ry="8" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="1690" cy="1000" rx="28" ry="4" stroke-width="1.2" opacity="0.45"/>
  </g>
  <g stroke="#907326">
    <ellipse cx="120" cy="1044" rx="70" ry="9" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="120" cy="1044" rx="32" ry="4.5" stroke-width="1.2" opacity="0.4"/>
  </g>
  <g stroke="#c07800">
    <ellipse cx="820" cy="1052" rx="80" ry="10" stroke-width="2" opacity="0.3"/>
    <ellipse cx="820" cy="1052" rx="38" ry="5" stroke-width="1.5" opacity="0.4"/>
  </g>
</g>

<!-- amber sheen on the wet ground -->
<ellipse cx="1180" cy="1035" rx="200" ry="26" fill="#f5a623" opacity="0.10" filter="url(#soft)"/>
<ellipse cx="430" cy="1018" rx="180" ry="24" fill="#c07800" opacity="0.10" filter="url(#soft)"/>

<!-- vignette -->
<rect width="1920" height="1080" fill="url(#vig)"/>

<!-- watermark -->
<text x="1850" y="1062" font-family="monospace" font-size="13" fill="#f5a623" opacity="0.22" text-anchor="end">AMBER LINUX · RESIN RAIN</text>
</svg>
