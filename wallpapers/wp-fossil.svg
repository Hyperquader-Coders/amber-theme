<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080">
<!-- AMBER LINUX · fossil-inclusion — a polished amber cabochon with a suspended
     crane fly, resin flow layers, air bubbles and refraction streaks.
     Palette: amberlinux.org tokens.css only. -->
<defs>
  <!-- Room: near-black with the faintest warm lift behind the stone -->
  <radialGradient id="bg" cx="63%" cy="46%" r="80%">
    <stop offset="0%" stop-color="#1a1600"/>
    <stop offset="45%" stop-color="#100d00"/>
    <stop offset="100%" stop-color="#080600"/>
  </radialGradient>

  <!-- The stone body: lit from upper-left, deepening to the rim -->
  <radialGradient id="stone" cx="40%" cy="34%" r="82%">
    <stop offset="0%"  stop-color="#f0c840"/>
    <stop offset="22%" stop-color="#f5a623"/>
    <stop offset="52%" stop-color="#c07800"/>
    <stop offset="78%" stop-color="#a05800"/>
    <stop offset="93%" stop-color="#5c3a10"/>
    <stop offset="100%" stop-color="#2d1800"/>
  </radialGradient>

  <!-- Depth core: darker heart where the resin is thickest -->
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#7d4400" stop-opacity="0.55"/>
    <stop offset="70%" stop-color="#5c3a10" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#2d1800" stop-opacity="0"/>
  </radialGradient>

  <!-- Transmitted-light window (light leaking through the thin edge) -->
  <radialGradient id="edgelight" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f0c840" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#f0c840" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="tableglow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c07800" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#c07800" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="vig" cx="50%" cy="48%" r="75%">
    <stop offset="55%" stop-color="#080600" stop-opacity="0"/>
    <stop offset="100%" stop-color="#080600" stop-opacity="0.85"/>
  </radialGradient>

  <filter id="haze"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="fine"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="hair"><feGaussianBlur stdDeviation="0.7"/></filter>

  <!-- The cabochon outline — an irregular polished nugget, off-centre right -->
  <path id="stonepath" d="M 850 540
    C 845 375, 965 215, 1200 195
    C 1420 176, 1620 300, 1660 490
    C 1698 670, 1580 830, 1350 870
    C 1120 910, 862 740, 850 540 Z"/>
  <clipPath id="stoneclip"><use xlink:href="#stonepath"/></clipPath>
</defs>

<!-- ============ room ============ -->
<rect width="1920" height="1080" fill="url(#bg)"/>

<!-- warm pool of light the stone throws onto the surface it rests on -->
<ellipse cx="1265" cy="905" rx="620" ry="120" fill="url(#tableglow)" filter="url(#haze)"/>
<ellipse cx="1265" cy="890" rx="420" ry="60" fill="#f5a623" opacity="0.10" filter="url(#soft)"/>

<!-- ambient glow behind the specimen -->
<ellipse cx="1255" cy="530" rx="620" ry="480" fill="#c07800" opacity="0.14" filter="url(#haze)"/>

<!-- drifting dust motes catching the glow -->
<g fill="#f0c840">
  <circle cx="420" cy="270" r="2.2" opacity="0.16"/>
  <circle cx="560" cy="700" r="1.6" opacity="0.13"/>
  <circle cx="300" cy="520" r="1.8" opacity="0.10"/>
  <circle cx="660" cy="180" r="1.4" opacity="0.12"/>
  <circle cx="490" cy="880" r="2.0" opacity="0.10"/>
  <circle cx="1760" cy="240" r="1.8" opacity="0.12"/>
  <circle cx="1830" cy="640" r="1.5" opacity="0.10"/>
</g>

<!-- contact shadow under the stone -->
<ellipse cx="1265" cy="878" rx="380" ry="42" fill="#080600" opacity="0.8" filter="url(#soft)"/>

<!-- ============ the stone ============ -->
<use xlink:href="#stonepath" fill="url(#stone)"/>

<g clip-path="url(#stoneclip)">
  <!-- dark resin heart -->
  <ellipse cx="1330" cy="600" rx="330" ry="250" fill="url(#core)"/>

  <!-- resin flow layers: broad internal bands laid down as the sap oozed -->
  <g fill="none" stroke="#7d4400" stroke-linecap="round">
    <path d="M 940 330 C 1080 270, 1300 255, 1480 330" stroke-width="34" opacity="0.20" filter="url(#soft)"/>
    <path d="M 900 470 C 1080 395, 1360 385, 1560 470" stroke-width="42" opacity="0.24" filter="url(#soft)"/>
    <path d="M 890 620 C 1090 545, 1400 540, 1620 640" stroke-width="50" opacity="0.26" filter="url(#soft)"/>
    <path d="M 930 760 C 1130 690, 1380 685, 1580 780" stroke-width="44" opacity="0.22" filter="url(#soft)"/>
  </g>

  <!-- concentric growth rings, slightly offset toward the flow centre -->
  <g fill="none" stroke="#a05800">
    <path d="M 1005 388 C 1105 322, 1300 310, 1435 380" stroke-width="2.5" opacity="0.38" filter="url(#hair)"/>
    <path d="M 962 462 C 1090 382, 1330 368, 1508 452" stroke-width="2.5" opacity="0.34" filter="url(#hair)"/>
    <path d="M 930 548 C 1085 452, 1370 438, 1572 540" stroke-width="3" opacity="0.32" filter="url(#hair)"/>
    <path d="M 918 646 C 1095 538, 1408 522, 1622 636" stroke-width="3" opacity="0.28" filter="url(#hair)"/>
    <path d="M 942 742 C 1120 640, 1420 626, 1610 738" stroke-width="2.5" opacity="0.24" filter="url(#hair)"/>
  </g>
  <g fill="none" stroke="#5c3a10">
    <path d="M 1030 415 C 1130 355, 1290 346, 1408 408" stroke-width="1.5" opacity="0.35" filter="url(#hair)"/>
    <path d="M 986 505 C 1110 425, 1330 412, 1490 498" stroke-width="1.5" opacity="0.30" filter="url(#hair)"/>
    <path d="M 956 598 C 1105 498, 1385 486, 1580 592" stroke-width="1.5" opacity="0.26" filter="url(#hair)"/>
  </g>

  <!-- ============ the inclusion: a crane fly, wings spread ============ -->
  <!-- scatter halo where light bends around the body -->
  <ellipse cx="1188" cy="452" rx="150" ry="96" fill="url(#edgelight)" opacity="0.5" filter="url(#soft)"/>

  <g transform="translate(1188 452) rotate(-14)" filter="url(#hair)">
    <!-- wings: membranous, half transparent -->
    <g fill="#5c3a10" opacity="0.45">
      <ellipse cx="42" cy="-30" rx="66" ry="15" transform="rotate(-24 42 -30)"/>
      <ellipse cx="46" cy="26" rx="62" ry="14" transform="rotate(20 46 26)"/>
    </g>
    <g fill="none" stroke="#2d1800" stroke-width="1" opacity="0.5">
      <ellipse cx="42" cy="-30" rx="66" ry="15" transform="rotate(-24 42 -30)"/>
      <ellipse cx="46" cy="26" rx="62" ry="14" transform="rotate(20 46 26)"/>
      <!-- wing venation -->
      <path d="M -8 -8 L 96 -56 M -8 -8 L 84 -40 M -8 -8 L 70 -26" transform="rotate(0)"/>
      <path d="M -6 8 L 96 48 M -6 8 L 82 34"/>
    </g>
    <!-- body -->
    <g fill="#2d1800" opacity="0.92">
      <ellipse cx="34" cy="0" rx="40" ry="6.5"/>          <!-- abdomen -->
      <ellipse cx="-12" cy="0" rx="14" ry="9.5"/>         <!-- thorax -->
      <circle cx="-32" cy="0" r="6.5"/>                   <!-- head -->
    </g>
    <!-- segment lines on abdomen -->
    <g stroke="#7d4400" stroke-width="1" opacity="0.5">
      <path d="M 12 -6 L 12 6 M 26 -6 L 26 6 M 40 -5 L 40 5 M 54 -4 L 54 4"/>
    </g>
    <!-- legs: long, jointed, trailing -->
    <g fill="none" stroke="#2d1800" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
      <path d="M -16 -7 C -34 -30, -58 -44, -84 -50"/>
      <path d="M -10 -8 C -18 -36, -30 -58, -52 -74"/>
      <path d="M -4 -8 C 6 -34, 4 -60, -10 -82"/>
      <path d="M -16 7 C -36 28, -60 40, -86 44"/>
      <path d="M -10 8 C -20 34, -34 54, -58 68"/>
      <path d="M -4 8 C 6 32, 2 58, -14 78"/>
    </g>
    <!-- antennae -->
    <g fill="none" stroke="#2d1800" stroke-width="1.1" stroke-linecap="round" opacity="0.8">
      <path d="M -37 -3 C -50 -10, -60 -12, -72 -10"/>
      <path d="M -37 3 C -50 8, -62 10, -74 6"/>
    </g>
  </g>

  <!-- ============ air bubbles trapped in the resin ============ -->
  <g>
    <g transform="translate(1420 380)">
      <circle r="13" fill="#2d1800" opacity="0.30"/>
      <circle r="13" fill="none" stroke="#f0c840" stroke-width="1.6" opacity="0.55"/>
      <circle cx="-4.5" cy="-4.5" r="2.6" fill="#fff" opacity="0.6"/>
    </g>
    <g transform="translate(1500 560)">
      <circle r="9" fill="#2d1800" opacity="0.28"/>
      <circle r="9" fill="none" stroke="#f0c840" stroke-width="1.3" opacity="0.5"/>
      <circle cx="-3" cy="-3" r="1.8" fill="#fff" opacity="0.55"/>
    </g>
    <g transform="translate(1090 640)">
      <circle r="11" fill="#2d1800" opacity="0.3"/>
      <circle r="11" fill="none" stroke="#f0c840" stroke-width="1.4" opacity="0.5"/>
      <circle cx="-3.6" cy="-3.6" r="2.2" fill="#fff" opacity="0.55"/>
    </g>
    <g transform="translate(1310 720)">
      <circle r="6" fill="#2d1800" opacity="0.28"/>
      <circle r="6" fill="none" stroke="#f5a623" stroke-width="1.1" opacity="0.5"/>
      <circle cx="-2" cy="-2" r="1.3" fill="#fff" opacity="0.5"/>
    </g>
    <g transform="translate(1020 350)">
      <circle r="5" fill="#2d1800" opacity="0.26"/>
      <circle r="5" fill="none" stroke="#f5a623" stroke-width="1" opacity="0.5"/>
      <circle cx="-1.7" cy="-1.7" r="1.1" fill="#fff" opacity="0.5"/>
    </g>
    <!-- a little train of micro-bubbles following a flow line -->
    <g fill="none" stroke="#f5a623" opacity="0.4">
      <circle cx="1180" cy="700" r="3.2"/>
      <circle cx="1214" cy="694" r="2.4"/>
      <circle cx="1244" cy="691" r="1.8"/>
      <circle cx="1268" cy="690" r="1.3"/>
    </g>
    <!-- plant debris flecks -->
    <g fill="#2d1800" opacity="0.55">
      <ellipse cx="1445" cy="680" rx="7" ry="2" transform="rotate(24 1445 680)"/>
      <ellipse cx="1010" cy="560" rx="5" ry="1.6" transform="rotate(-30 1010 560)"/>
      <ellipse cx="1250" cy="290" rx="6" ry="1.8" transform="rotate(10 1250 290)"/>
      <ellipse cx="1560" cy="470" rx="4" ry="1.4" transform="rotate(-15 1560 470)"/>
    </g>
  </g>

  <!-- ============ refraction and polish ============ -->
  <!-- long curved refraction streaks following the upper-left surface -->
  <path d="M 920 330 C 1060 240, 1280 216, 1470 280" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" opacity="0.10" filter="url(#soft)"/>
  <path d="M 946 372 C 1080 292, 1260 274, 1420 322" fill="none" stroke="#f0c840" stroke-width="9" stroke-linecap="round" opacity="0.35" filter="url(#fine)"/>
  <path d="M 905 555 C 940 460, 1000 380, 1085 322" fill="none" stroke="#f0c840" stroke-width="7" stroke-linecap="round" opacity="0.22" filter="url(#fine)"/>
  <!-- lower-right internal bounce -->
  <path d="M 1250 830 C 1420 810, 1560 730, 1630 620" fill="none" stroke="#f5a623" stroke-width="16" stroke-linecap="round" opacity="0.18" filter="url(#soft)"/>
  <!-- crisp specular highlight -->
  <ellipse cx="1108" cy="300" rx="46" ry="17" transform="rotate(-18 1108 300)" fill="#fff" opacity="0.5" filter="url(#fine)"/>
  <ellipse cx="1108" cy="300" rx="18" ry="6" transform="rotate(-18 1108 300)" fill="#fff" opacity="0.55" filter="url(#hair)"/>
  <!-- thin edge glowing where light passes through -->
  <ellipse cx="1600" cy="660" rx="130" ry="170" fill="url(#edgelight)" opacity="0.7"/>

  <!-- internal fracture ("sun spangle") catching the light -->
  <g stroke="#f0c840" fill="none" stroke-linecap="round">
    <path d="M 1355 505 L 1430 528 M 1372 488 L 1428 462 M 1385 522 L 1418 566 M 1398 500 L 1462 502" stroke-width="1.4" opacity="0.35" filter="url(#hair)"/>
  </g>
</g>

<!-- rim: dark polished edge with a lit inner line -->
<use xlink:href="#stonepath" fill="none" stroke="#2d1800" stroke-width="7" opacity="0.85"/>
<use xlink:href="#stonepath" fill="none" stroke="#c07800" stroke-width="2" opacity="0.5"/>
<path d="M 900 380 C 940 300, 1030 232, 1150 206" fill="none" stroke="#f0c840" stroke-width="3.5" stroke-linecap="round" opacity="0.55" filter="url(#hair)"/>

<!-- reflection of the stone in the polished surface -->
<g transform="translate(0 1760) scale(1 -1)" opacity="0.10">
  <use xlink:href="#stonepath" fill="url(#stone)" filter="url(#soft)"/>
</g>
<rect x="0" y="880" width="1920" height="200" fill="#080600" opacity="0.35"/>

<!-- vignette -->
<rect width="1920" height="1080" fill="url(#vig)"/>

<!-- watermark -->
<text x="1850" y="1062" font-family="monospace" font-size="13" fill="#f5a623" opacity="0.22" text-anchor="end">AMBER LINUX · INCLUSION</text>
</svg>
