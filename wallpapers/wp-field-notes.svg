<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080">
<!-- AMBER LINUX · field-notes (light) — an engineer's plate on parchment:
     cross-section of an amber phosphor CRT, annotated in ink, with the P3
     emission curve inset and an amber stain where the mug sat.
     Palette: amberlinux.org tokens.css (light values) only. -->
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0%"  stop-color="#fffdf7"/>
    <stop offset="55%" stop-color="#fdf8ee"/>
    <stop offset="100%" stop-color="#f5edd8"/>
  </linearGradient>

  <radialGradient id="phosglow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f0c840" stop-opacity="0.8"/>
    <stop offset="60%" stop-color="#f5a623" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
  </radialGradient>

  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="fine"><feGaussianBlur stdDeviation="2.5"/></filter>

  <pattern id="grain" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="7" cy="9" r="0.9" fill="#e8d5a8" opacity="0.5"/>
    <circle cx="20" cy="21" r="0.7" fill="#e8d5a8" opacity="0.4"/>
  </pattern>

  <pattern id="graph" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8d5a8" stroke-width="1" opacity="0.7"/>
  </pattern>

  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5c3a10" stroke-width="1.4"/>
  </marker>
</defs>

<!-- ============ the sheet ============ -->
<rect width="1920" height="1080" fill="url(#paper)"/>
<rect width="1920" height="1080" fill="url(#grain)"/>
<ellipse cx="500" cy="140" rx="900" ry="480" fill="#fffdf7" opacity="0.5" filter="url(#soft)"/>

<!-- plate frame -->
<rect x="46" y="46" width="1828" height="988" fill="none" stroke="#e8d5a8" stroke-width="3"/>
<rect x="60" y="60" width="1800" height="960" fill="none" stroke="#9a6830" stroke-width="1" opacity="0.5"/>

<!-- title block, top-left, ruled like an engineering sheet -->
<g font-family="'Courier New', Courier, monospace" fill="#5c3a10">
  <text x="120" y="152" font-size="30" letter-spacing="3">AMBER LINUX — FIELD NOTES</text>
  <text x="120" y="192" font-size="18" fill="#9a6830">Plate II · amber phosphor CRT, longitudinal section · ca. 1983</text>
</g>
<line x1="120" y1="216" x2="880" y2="216" stroke="#9a6830" stroke-width="1" opacity="0.6"/>
<line x1="120" y1="221" x2="880" y2="221" stroke="#e8d5a8" stroke-width="2"/>

<!-- ============ graph-paper zone behind the drawing ============ -->
<rect x="120" y="330" width="1010" height="560" fill="url(#graph)"/>
<rect x="120" y="330" width="1010" height="560" fill="none" stroke="#e8d5a8" stroke-width="1.5"/>

<!-- ============ the tube, drawn in ink ============ -->
<!-- glass envelope -->
<path d="M 230 570 L 470 570
         C 640 480, 800 448, 880 430
         C 920 422, 950 420, 962 420
         C 986 500, 986 720, 962 800
         C 950 800, 920 798, 880 790
         C 800 772, 640 740, 470 650 L 230 650
         C 218 650, 210 636, 210 610 C 210 584, 218 570, 230 570 Z"
      fill="#f5a623" fill-opacity="0.07" stroke="#a05800" stroke-width="3"/>
<!-- inner envelope line -->
<path d="M 244 584 L 470 584 C 632 498, 792 464, 900 442
         M 244 636 L 470 636 C 632 722, 792 756, 900 778"
      fill="none" stroke="#a05800" stroke-width="1.2" opacity="0.55"/>

<!-- electron gun assembly -->
<g stroke="#7d4400" fill="none">
  <rect x="252" y="588" width="46" height="44" stroke-width="2"/>
  <line x1="308" y1="592" x2="308" y2="628" stroke-width="2"/>
  <line x1="322" y1="588" x2="322" y2="632" stroke-width="2"/>
  <line x1="336" y1="592" x2="336" y2="628" stroke-width="2"/>
  <rect x="350" y="596" width="26" height="28" stroke-width="2"/>
  <line x1="230" y1="610" x2="252" y2="610" stroke-width="2"/>
</g>
<!-- heater squiggle in the cathode -->
<path d="M 258 610 q 5 -8 10 0 q 5 8 10 0 q 5 -8 10 0" fill="none" stroke="#c07800" stroke-width="1.6"/>

<!-- deflection yoke: coil hatching around the neck -->
<g stroke="#9a6830" fill="none" stroke-width="1.6" opacity="0.85">
  <path d="M 402 560 C 396 594, 396 626, 402 660"/>
  <path d="M 414 556 C 407 594, 407 626, 414 664"/>
  <path d="M 426 553 C 418 594, 418 626, 426 667"/>
  <path d="M 438 550 C 429 594, 429 626, 438 670"/>
  <path d="M 450 548 C 440 594, 440 626, 450 672"/>
</g>
<ellipse cx="426" cy="610" rx="34" ry="64" fill="none" stroke="#9a6830" stroke-width="1.2" opacity="0.5"/>

<!-- electron beam, spreading as it flies -->
<g stroke="#c07800" fill="none" stroke-dasharray="8 7">
  <line x1="378" y1="610" x2="930" y2="610" stroke-width="2"/>
  <line x1="378" y1="608" x2="930" y2="512" stroke-width="1.3" opacity="0.6"/>
  <line x1="378" y1="612" x2="930" y2="708" stroke-width="1.3" opacity="0.6"/>
</g>

<!-- phosphor coating on the inside of the face -->
<path d="M 942 448 C 962 520, 962 700, 942 772" fill="none" stroke="#f5a623" stroke-width="8" opacity="0.85"/>
<!-- the glowing spot where the beam lands -->
<circle cx="944" cy="610" r="46" fill="url(#phosglow)"/>
<circle cx="944" cy="610" r="7" fill="#f0c840" opacity="0.95" filter="url(#fine)"/>

<!-- faint raster lines on the face -->
<g stroke="#f5a623" opacity="0.35" stroke-width="1.2">
  <path d="M 947 500 C 957 540, 957 560, 953 574"/>
  <path d="M 950 646 C 957 668, 956 690, 949 716"/>
</g>

<!-- dimension line under the tube -->
<g stroke="#5c3a10" stroke-width="1.4" fill="none">
  <line x1="210" y1="852" x2="986" y2="852" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="210" y1="820" x2="210" y2="862"/>
  <line x1="986" y1="820" x2="986" y2="862"/>
</g>
<rect x="548" y="836" width="110" height="30" fill="#fdf8ee"/>
<text x="600" y="858" font-family="'Courier New', Courier, monospace" font-size="17" fill="#5c3a10" text-anchor="middle">340 mm</text>

<!-- ============ annotations with leader lines ============ -->
<g font-family="'Courier New', Courier, monospace" font-size="17" fill="#5c3a10">
  <text x="176" y="500">electron gun</text>
  <text x="330" y="384">deflection yoke</text>
  <text x="620" y="548">e⁻ beam</text>
  <text x="1010" y="392">glass envelope</text>
  <text x="1010" y="700">P3 phosphor</text>
  <text x="1010" y="726" fill="#9a6830" font-size="15">Zn₈BeSi₅O₁₉:Mn</text>
  <text x="1010" y="752" fill="#9a6830" font-size="15">λ peak ≈ 585 nm</text>
</g>
<g fill="none" stroke="#9a6830" stroke-width="1.2" opacity="0.7">
  <path d="M 240 508 C 254 540, 264 566, 274 588"/>
  <path d="M 404 392 C 414 440, 420 500, 424 546"/>
  <path d="M 660 556 C 664 576, 668 592, 672 606"/>
  <path d="M 1004 386 C 964 396, 936 410, 916 428"/>
  <path d="M 1004 694 C 980 680, 962 662, 950 646"/>
</g>
<g fill="#9a6830" opacity="0.8">
  <circle cx="274" cy="588" r="2.6"/>
  <circle cx="424" cy="546" r="2.6"/>
  <circle cx="672" cy="606" r="2.6"/>
  <circle cx="916" cy="428" r="2.6"/>
  <circle cx="950" cy="646" r="2.6"/>
</g>

<!-- ============ inset: P3 emission spectrum, upper right ============ -->
<g transform="translate(1310 300)">
  <rect x="0" y="0" width="460" height="300" fill="#fffdf7" opacity="0.75"/>
  <rect x="0" y="0" width="460" height="300" fill="none" stroke="#e8d5a8" stroke-width="2"/>
  <!-- axes -->
  <g stroke="#9a6830" stroke-width="1.4" fill="none">
    <line x1="56" y1="36" x2="56" y2="240" marker-start="url(#arrow)"/>
    <line x1="56" y1="240" x2="424" y2="240" marker-end="url(#arrow)"/>
  </g>
  <!-- gridlines -->
  <g stroke="#e8d5a8" stroke-width="1">
    <line x1="148" y1="240" x2="148" y2="60"/>
    <line x1="240" y1="240" x2="240" y2="60"/>
    <line x1="332" y1="240" x2="332" y2="60"/>
  </g>
  <!-- the emission curve, peaking at 585 nm -->
  <path d="M 70 236 C 140 232, 190 220, 224 170 C 250 132, 262 86, 276 82
           C 290 86, 304 140, 330 190 C 352 226, 386 234, 414 236"
        fill="#f5a623" fill-opacity="0.18" stroke="#c07800" stroke-width="2.5"/>
  <!-- peak marker -->
  <line x1="276" y1="82" x2="276" y2="240" stroke="#a05800" stroke-width="1" stroke-dasharray="4 5" opacity="0.7"/>
  <circle cx="276" cy="82" r="4" fill="#f5a623" stroke="#a05800" stroke-width="1.2"/>
  <!-- labels -->
  <g font-family="'Courier New', Courier, monospace" fill="#9a6830" font-size="14">
    <text x="240" y="278" text-anchor="middle" fill="#5c3a10">wavelength, nm</text>
    <text x="148" y="258" text-anchor="middle">500</text>
    <text x="276" y="258" text-anchor="middle" fill="#5c3a10">585</text>
    <text x="404" y="258" text-anchor="middle">700</text>
    <text x="30" y="140" transform="rotate(-90 30 140)" text-anchor="middle">rel. intensity</text>
    <text x="240" y="34" text-anchor="middle" fill="#5c3a10" font-size="15" letter-spacing="2">P3 EMISSION</text>
  </g>
</g>

<!-- ============ marginalia ============ -->
<g font-family="'Courier New', Courier, monospace" font-size="16" fill="#9a6830">
  <text x="1310" y="680">n.b. persistence ~ tens of ms —</text>
  <text x="1310" y="706">the glow outlives the beam.</text>
  <text x="1310" y="756" fill="#5c3a10">cf. resin: the amber outlives</text>
  <text x="1310" y="782" fill="#5c3a10">the tree. same trick, slower.</text>
</g>

<!-- amber ring where the mug sat, lower right, over the frame -->
<g transform="translate(1690 930)">
  <circle r="66" fill="none" stroke="#f5a623" stroke-width="13" opacity="0.20"/>
  <circle r="66" fill="none" stroke="#c07800" stroke-width="4" opacity="0.16"/>
  <path d="M -20 60 A 66 66 0 0 1 -63 -18" fill="none" stroke="#c07800" stroke-width="7" opacity="0.22"/>
  <ellipse cx="52" cy="44" rx="16" ry="9" fill="#f5a623" opacity="0.20"/>
</g>
<!-- a small splash mark -->
<ellipse cx="1560" cy="988" rx="12" ry="6" fill="#f5a623" opacity="0.18"/>

<!-- plate caption -->
<text x="960" y="1000" font-family="'Courier New', Courier, monospace" font-size="16" fill="#9a6830" text-anchor="middle" letter-spacing="6" opacity="0.85">AMBER LINUX · FIELD NOTES · PLATE II</text>

<!-- watermark -->
<text x="1850" y="1062" font-family="monospace" font-size="13" fill="#a05800" opacity="0.35" text-anchor="end">AMBER LINUX · FIELD NOTES</text>
</svg>
