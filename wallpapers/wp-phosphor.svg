<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#0e0b00"/>
    <stop offset="100%" stop-color="#040300"/>
  </radialGradient>
  <!-- Dim base dot -->
  <radialGradient id="dg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c87000"/>
    <stop offset="100%" stop-color="#6a3800" stop-opacity="0"/>
  </radialGradient>
  <!-- Bright dot -->
  <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffd060"/>
    <stop offset="60%" stop-color="#f5a623"/>
    <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
  </radialGradient>
  <!-- Scanline overlay -->
  <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="1920" height="1" fill="#000000" opacity="0.25"/>
  </pattern>
  <!-- Dim dot tile (24px grid) -->
  <pattern id="dim-dot" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="2.8" fill="#c87000" opacity="0.22"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bloom">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
  <filter id="haze">
    <feGaussianBlur stdDeviation="60"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1920" height="1080" fill="url(#bg)"/>

<!-- Base phosphor dot field -->
<rect width="1920" height="1080" fill="url(#dim-dot)"/>

<!-- Warm centre bloom -->
<ellipse cx="960" cy="540" rx="600" ry="400" fill="#c87000" opacity="0.06" filter="url(#haze)"/>

<!-- Bright phosphor dots — spelling / forming patterns
     Arranged to form a "10" shape in the dot grid, using brighter dots -->

<!-- Left part of "1" — column ~x=720 -->
<g filter="url(#glow)">
  <!-- Digit "1" — vertical bar at x=720, y=240 to 840 -->
  <circle cx="720" cy="240" r="5" fill="#ffd060" opacity="0.9"/>
  <circle cx="720" cy="264" r="5" fill="#f5a623" opacity="0.85"/>
  <circle cx="720" cy="288" r="4.5" fill="#f5a623" opacity="0.8"/>
