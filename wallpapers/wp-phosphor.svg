  <circle cx="720" cy="576" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="600" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="624" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="648" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="672" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="696" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="720" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="744" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="768" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="720" cy="792" r="5" fill="#f5a623" opacity="0.85"/>
  <circle cx="720" cy="816" r="5" fill="#ffd060" opacity="0.9"/>
  <!-- Serif at top -->
