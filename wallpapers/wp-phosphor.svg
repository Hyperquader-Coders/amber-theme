  <circle cx="1056" cy="780" r="4" fill="#f5a623" opacity="0.75"/>

  <!-- Scattered bright extras across field -->
  <circle cx="200" cy="180" r="4" fill="#f5a623" opacity="0.55"/>
  <circle cx="350" cy="420" r="3.5" fill="#c87000" opacity="0.6"/>
  <circle cx="520" cy="300" r="4" fill="#f5a623" opacity="0.5"/>
  <circle cx="150" cy="650" r="3.5" fill="#c87000" opacity="0.55"/>
  <circle cx="480" cy="750" r="4" fill="#f5a623" opacity="0.5"/>
  <circle cx="1400" cy="200" r="4" fill="#f5a623" opacity="0.55"/>
  <circle cx="1600" cy="450" r="3.5" fill="#c87000" opacity="0.6"/>
  <circle cx="1750" cy="300" r="4" fill="#f5a623" opacity="0.5"/>
  <circle cx="1350" cy="700" r="3.5" fill="#c87000" opacity="0.55"/>
  <circle cx="1680" cy="820" r="4" fill="#f5a623" opacity="0.5"/>
</g>

<!-- Scanline overlay -->
<rect width="1920" height="1080" fill="url(#scan)"/>

<!-- Vignette -->
<radialGradient id="vig" cx="50%" cy="50%" r="70%">
  <stop offset="50%" stop-color="transparent"/>
  <stop offset="100%" stop-color="#020100"/>
</radialGradient>
<rect width="1920" height="1080" fill="url(#vig)"/>

<!-- Watermark -->
<text x="960" y="960" font-family="monospace" font-size="13" fill="#f5a623" opacity="0.2" text-anchor="middle" letter-spacing="6">AMBER LINUX · PHOSPHOR GRID · P3 PHOSPHOR EMISSION</text>
</svg>
