  <circle cx="1080" cy="576" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="1080" cy="624" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="1080" cy="672" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="1080" cy="720" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="1068" cy="756" r="4" fill="#f5a623" opacity="0.75"/>
  <!-- Bottom arc -->
  <circle cx="864" cy="780" r="4" fill="#f5a623" opacity="0.75"/>
  <circle cx="888" cy="800" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="912" cy="812" r="4.5" fill="#f5a623" opacity="0.8"/>
