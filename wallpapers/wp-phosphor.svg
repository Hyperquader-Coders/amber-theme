  <circle cx="744" cy="264" r="4" fill="#f5a623" opacity="0.7"/>
  <!-- Diagonal to top -->
  <circle cx="696" cy="240" r="4.5" fill="#f5a623" opacity="0.75"/>

  <!-- Digit "0" — oval shape x=840-1020, y=240-840 -->
  <!-- Top arc -->
  <circle cx="936" cy="240" r="5" fill="#ffd060" opacity="0.9"/>
  <circle cx="960" cy="240" r="5" fill="#ffd060" opacity="0.95"/>
  <circle cx="984" cy="240" r="5" fill="#ffd060" opacity="0.9"/>
  <circle cx="912" cy="252" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="1008" cy="252" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="888" cy="276" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="1032" cy="276" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="864" cy="300" r="4" fill="#f5a623" opacity="0.75"/>
  <circle cx="1056" cy="300" r="4" fill="#f5a623" opacity="0.75"/>
  <!-- Left side -->
  <circle cx="852" cy="336" r="4" fill="#f5a623" opacity="0.75"/>
  <circle cx="840" cy="384" r="4.5" fill="#f5a623" opacity="0.8"/>
  <circle cx="840" cy="432" r="4.5" fill="#f5a623" opacity="0.8"/>
